<!DOCTYPE html>
<html>
<head>
  <title>Cursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
  <h2>Cursos</h2>

  <div class="card p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-4"><input id="nombre" class="form-control" placeholder="Nombre"></div>
      <div class="col-md-4"><input id="descripcion" class="form-control" placeholder="Descripción"></div>
      <div class="col-md-4"><input id="profesor" class="form-control" placeholder="ID Profesor"></div>
    </div>
    <button onclick="crear()" class="btn btn-dark mt-3">Guardar</button>
  </div>

  <div class="card p-3 mb-4">
    <h5>Asociar Estudiante a Curso</h5>
    <div class="row g-2">
      <div class="col-md-6"><input id="curso_id" class="form-control" placeholder="ID Curso"></div>
      <div class="col-md-6"><input id="estudiante_id" class="form-control" placeholder="ID Estudiante"></div>
    </div>
    <button onclick="asociar()" class="btn btn-warning mt-3">Asociar</button>
  </div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Curso</th><th>Descripción</th><th>Profesor</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
</div>

<script src="js/cursos.js"></script>
</body>
</html>
