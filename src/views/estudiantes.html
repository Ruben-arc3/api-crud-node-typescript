<!DOCTYPE html>
<html>
<head>
  <title>Estudiantes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
  <h2 class="mb-3">Registro de Estudiantes</h2>

  <div class="card p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-3"><input id="nombre" class="form-control" placeholder="Nombre"></div>
      <div class="col-md-3"><input id="apellido" class="form-control" placeholder="Apellido"></div>
      <div class="col-md-3"><input id="cedula" class="form-control" placeholder="Cédula"></div>
      <div class="col-md-3"><input id="email" class="form-control" placeholder="Email"></div>
    </div>
    <button onclick="crear()" class="btn btn-primary mt-3">Guardar</button>
  </div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Cédula</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
</div>

<script src="js/estudiantes.js"></script>
</body>
</html>
